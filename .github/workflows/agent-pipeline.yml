name: Agentic Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "agents/inbox/idea.json"
      - "tickets/**.json"

  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Ticket ID to process (e.g. TICKET-001)"
        required: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Requirements Agent
  # Triggers when a new idea lands in inbox
  # ─────────────────────────────────────────────
  requirements:
    name: "🧠 Requirements Agent"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, 'agents/inbox/idea.json'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure git
        run: |
          git config user.name "Fashion OS Agent"
          git config user.email "agent@fashionos.ai"

      - name: Run Requirements Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agents/requirements-agent.js

      - name: Commit ticket to repo
        run: |
          git add tickets/ agents/inbox/
          git diff --staged --quiet || git commit -m "feat: requirements agent created ticket"
          git push origin main

  # ─────────────────────────────────────────────
  # JOB 2: Dev Agent
  # Triggers when a ticket has status = requirements_ready
  # ─────────────────────────────────────────────
  dev:
    name: "🔨 Dev Agent"
    runs-on: ubuntu-latest
    needs: requirements
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure git
        run: |
          git config user.name "Fashion OS Agent"
          git config user.email "agent@fashionos.ai"

      - name: Check for ready tickets
        id: check
        run: |
          READY=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.cwd(), 'tickets');
            if (!fs.existsSync(dir)) { console.log('none'); process.exit(0); }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            const ready = files.find(f => {
              const t = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              return t.status === 'requirements_ready';
            });
            console.log(ready ? ready.replace('.json', '') : 'none');
          ")
          echo "ticket=$READY" >> $GITHUB_OUTPUT
          echo "Found ticket: $READY"

      - name: Run Dev Agent
        if: steps.check.outputs.ticket != 'none'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agents/dev-agent.js ${{ steps.check.outputs.ticket }}

  # ─────────────────────────────────────────────
  # JOB 3: Test Agent
  # Triggers when a ticket has status = code_ready
  # ─────────────────────────────────────────────
  test:
    name: "🧪 Test Agent"
    runs-on: ubuntu-latest
    needs: dev
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure git
        run: |
          git config user.name "Fashion OS Agent"
          git config user.email "agent@fashionos.ai"

      - name: Check for code_ready tickets
        id: check
        run: |
          READY=$(node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.cwd(), 'tickets');
            if (!fs.existsSync(dir)) { console.log('none'); process.exit(0); }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            const ready = files.find(f => {
              const t = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              return t.status === 'code_ready';
            });
            console.log(ready ? ready.replace('.json', '') : 'none');
          ")
          echo "ticket=$READY" >> $GITHUB_OUTPUT
          echo "Found ticket: $READY"

      - name: Run Test Agent
        if: steps.check.outputs.ticket != 'none'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agents/test-agent.js ${{ steps.check.outputs.ticket }}

      - name: Open PR if tests passed
        if: steps.check.outputs.ticket != 'none'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          TICKET="${{ steps.check.outputs.ticket }}"
          BRANCH=$(node -e "
            const fs = require('fs');
            const t = JSON.parse(fs.readFileSync('tickets/${TICKET}.json', 'utf8'));
            console.log(t.branch || '');
          ")
          if [ -n "$BRANCH" ]; then
            gh pr create \
              --title "[$TICKET] $(node -e "const t=JSON.parse(require('fs').readFileSync('tickets/${TICKET}.json','utf8')); console.log(t.title)")" \
              --body "$(node -e "
                const t=JSON.parse(require('fs').readFileSync('tickets/${TICKET}.json','utf8'));
                const r=t.test_results;
                console.log('## ' + t.title + '\n\n**Ticket:** ' + t.ticket_id + '\n**Dev summary:** ' + t.dev_summary + '\n\n## Test Results\n' + r.summary + '\n\n## Acceptance Criteria\n' + r.results.map(x => (x.status==='passed'?'✅':'❌') + ' ' + x.criterion).join('\n') + '\n\n---\n*Generated by Agentic Pipeline*');
              ")" \
              --base main \
              --head "$BRANCH" || echo "PR already exists"
          fi
